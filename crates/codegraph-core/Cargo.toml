[package]
name = "codegraph-core"
version = "3.16.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps object keys in JSON-source declaration order (an
# IndexMap internally) instead of the default sorted-by-key BTreeMap. Needed
# for package.json `exports` subpath-map wildcard resolution (resolve.rs) to
# match resolveViaExports()'s `Object.entries()` iteration order in
# resolve.ts — when overlapping wildcard patterns both match, whichever
# pattern is declared first in the manifest wins on both engines; without
# this feature, native would silently pick the lexicographically-first
# pattern instead, diverging from WASM for any manifest where declaration
# order differs from sort order.
serde_json = { version = "1", features = ["preserve_order"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-cuda = "0.21"
tree-sitter-kotlin-sg = "0.4"
tree-sitter-swift = "0.7"
tree-sitter-scala = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-hcl = "1"
tree-sitter-elixir = "0.3"
tree-sitter-lua = "0.5"
tree-sitter-dart = "0.2"
tree-sitter-zig = "1"
tree-sitter-haskell = "0.23"
tree-sitter-ocaml = "0.24"
tree-sitter-fsharp = "0.3"
tree-sitter-objc = "3"
tree-sitter-gleam = "1"
tree-sitter-julia = "0.23"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-erlang = "0.16"
tree-sitter-groovy = "0.1"
tree-sitter-r = "1.2"
tree-sitter-solidity = "1.2"
tree-sitter-verilog = "1.0.3"
rayon = "1"
ignore = "0.4"
globset = "0.4"
sha2 = "0.10"
# `bundled` embeds a second SQLite copy (better-sqlite3 already bundles one).
# This is intentional: Windows CI lacks a system SQLite, and WAL coordination
# between the two instances is handled safely at the OS level.
rusqlite = { version = "0.32", features = ["bundled"] }
send_wrapper = "0.6"
toml = "1.1.4"

[build-dependencies]
napi-build = "2"
